[package]
name = "copernicus_explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
default-run = "copernicus_explorer"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
dirs = "6"
tempfile = { version = "3", optional = true }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "copernicus_explorer"
path = "src/bin/copernicus_explorer.rs"

[[bin]]
name = "copernicus_explorer_cli"
path = "src/bin/copernicus_explorer_cli.rs"
